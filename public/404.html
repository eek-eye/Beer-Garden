<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Página no encontrada — Bar Chinesca Mxli</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/IMAGES/favicon-32.png">
    <!-- Self-contained on purpose: this page must render even if the stylesheet does not load.
         A top-level 404.html is also what stops Cloudflare Pages from treating the site as a
         single-page app (without it, every unknown URL would return the home page with a 200). -->
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0a0a;color:#f6eadb;font-family:Georgia,'Times New Roman',serif;text-align:center;padding:1.5rem}
        .card{max-width:32rem}
        h1{color:#f2c14e;font-size:3.25rem;margin:0 0 .25rem;letter-spacing:.06em}
        p{margin:.5rem 0;line-height:1.6}
        .muted{color:#b9a894;font-size:.92rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
        .btn{display:inline-block;margin-top:1.75rem;padding:.8rem 1.6rem;border:1px solid #f2c14e;border-radius:2rem;color:#f2c14e;text-decoration:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:.95rem}
        .btn:hover,.btn:focus{background:#f2c14e;color:#1a0f0f}
    </style>
</head>
<body>
    <main class="card">
        <h1>404</h1>
        <p>No encontramos esta página.</p>
        <p class="muted">La noche sigue abierta: vuelve al inicio y reserva tu mesa.</p>
        <a class="btn" href="/">Volver al inicio</a>
    </main>
</body>
</html>
